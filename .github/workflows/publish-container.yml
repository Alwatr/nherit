# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Build & Publish Containers

on:
  workflow_dispatch:

  push:
    branches:
      - next

  pull_request:

  release:
    types:
      - created

env:
  USER: alwatr

jobs:
  test:
    if: github.repository_owner == 'Alwatr'

    name: Test Containers
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: ⤵️ Checkout repository
        uses: actions/checkout@v7

      - name: ❔ Check Container files changed
        id: file_change
        if: ${{ github.event_name != 'release' && github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            nginx: nginx/**
            nginx-core: nginx-core/**
            nginx-ws: nginx-ws/**
            nginx-cdn: nginx-cdn/**
            nginx-json: nginx-json/**
            nginx-pwa: nginx-pwa/**

      # Build in dependency order on one runner. Each image is also tagged as the exact base image
      # that its children use in FROM, so they are tested on this commit, not on the last release.
      # An image is tested when its folder changed or its base image was built here (release: all).
      - name: 🧪 Build and test changed containers
        env:
          CHANGED: ${{ join(fromJSON(steps.file_change.outputs.changes || '["nginx"]'), ' ') }}
        run: |
          echo "Changed: $CHANGED"
          built=""
          for path in nginx nginx-core nginx-ws nginx-cdn nginx-json nginx-pwa; do
            parent=$(sed -n "s#^FROM ghcr.io/$USER/\([^:]*\):.*#\1#p" "$path/Dockerfile")
            case " $CHANGED $built " in
            *" $path "* | *" ${parent:-none} "*) ;;
            *) echo "Skip $path"; continue ;;
            esac
            echo "::group::Build and test $path"
            docker build -t "$USER/$path:test" "./$path"
            docker run --rm -e TEST_MODE=1 "$USER/$path:test" /etc/nginx/entrypoint.sh nginx -T -c /etc/nginx/nginx.conf
            for child in */Dockerfile; do
              base=$(sed -n "s#^FROM \(ghcr.io/$USER/$path:[^ ]*\).*#\1#p" "$child")
              if [ -n "$base" ]; then docker tag "$USER/$path:test" "$base"; fi
            done
            built="$built $path"
            echo "::endgroup::"
          done

  build:
    needs: test
    if: github.repository_owner == 'Alwatr'

    name: Build & Publish Containers
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - path: nginx
          - path: nginx-core
          - path: nginx-ws
          - path: nginx-cdn
          - path: nginx-json
          - path: nginx-pwa

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: ⤵️ Checkout repository
        uses: actions/checkout@v7

      - name: ❔ Check Container files changed
        id: file_change
        if: ${{ github.event_name != 'release' && github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            container_folder:
              ./${{ matrix.path }}/**

      - name: 🏗 Install cosign
        if: ${{ github.event_name != 'pull_request' && steps.file_change.outputs.container_folder != 'false' }}
        uses: sigstore/cosign-installer@v4.1.2

      - name: 🏗 Setup Docker Buildx
        if: ${{ steps.file_change.outputs.container_folder != 'false' }}
        uses: docker/setup-buildx-action@v4

      - name: 🏗 Cache Docker Layers
        if: ${{ steps.file_change.outputs.container_folder != 'false' }}
        uses: actions/cache@v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: container/${{ matrix.path }}

      - name: 🏗 Log into docker hub registry
        if: ${{ github.event_name != 'pull_request' && steps.file_change.outputs.container_folder != 'false' }}
        uses: docker/login-action@v4
        with:
          username: ${{env.USER}}
          password: ${{secrets.DOCKER_HUB_TOKEN}}

      - name: 🏗 Log into ghcr.io registry
        if: ${{ github.event_name != 'pull_request' && steps.file_change.outputs.container_folder != 'false' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{env.USER}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: 🏗 Extract metadata
        if: ${{ steps.file_change.outputs.container_folder != 'false' }}
        id: meta
        uses: docker/metadata-action@v6
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          images: |
            name=ghcr.io/${{env.USER}}/${{matrix.path}},enable=true
            name=docker.io/${{env.USER}}/${{matrix.path}},enable=true
          tags: |
            type=semver,enable=true,pattern={{major}}
            type=semver,enable=true,pattern={{major}}.{{minor}}
            type=semver,enable=true,pattern={{version}}
            type=ref,enable=true,event=branch

      - name: 🚀 Build and publish container image
        if: ${{ steps.file_change.outputs.container_folder != 'false' }}
        uses: docker/build-push-action@v7
        env:
          NGINX_ERROR_LOG_LEVEL: debug
          NGINX_ENABLE_ACCESS_LOG: 'on'
          NGINX_PROCESSES_AUTOTUNE: 'on'
          NGINX_RESOLVERS: 'local'
          NGINX_DISALLOW_ROBOTS: 'on'
          NGINX_LOWERCASE_URI: 'on'

        with:
          context: ./${{matrix.path}}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          build-args: |
            BUILD_DATE=${{github.event.repository.updated_at}}
            BUILD_REV=${{github.sha}}
